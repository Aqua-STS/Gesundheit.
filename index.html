<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYTOS_OS // HODEN & SPERMATOGENESE</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --panel-bg: #161920;
            --border-color: #2a2f3a;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-green: #238636;
            --accent-green-hover: #2ea043;
            --accent-red: #da3633;
            --accent-blue: #58a6ff;
            --accent-purple: #bc8cff;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
        }

        header {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sys-title {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-blue);
            letter-spacing: 1px;
        }

        .sys-status {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-secondary);
        }

        nav {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        .nav-btn {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 4px;
            border-radius: 4px;
            font-size: 10px;
            font-family: var(--font-mono);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .nav-btn.active {
            background: var(--border-color);
            color: var(--text-primary);
            border-color: var(--accent-blue);
        }

        main {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .view-panel {
            display: none;
            flex-direction: column;
            gap: 16px;
            height: 100%;
        }

        .view-panel.active {
            display: flex;
        }

        .topic-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .topic-btn {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
        }

        .topic-btn.active {
            border-color: var(--accent-purple);
            color: var(--accent-purple);
            background: rgba(188, 140, 255, 0.1);
        }

        /* Flashcard Styles */
        .card-container {
            perspective: 1000px;
            width: 100%;
            height: 220px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.4s;
            transform-style: preserve-3d;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--bg-color);
        }

        .card-back {
            transform: rotateY(180deg);
            border-color: var(--accent-blue);
        }

        .card-label {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .card-text {
            font-size: 16px;
            font-weight: bold;
        }

        /* Quiz Styles */
        .quiz-option {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: border-color 0.2s;
        }

        .quiz-option.correct {
            border-color: var(--accent-green);
            background: rgba(35, 134, 54, 0.15);
        }

        .quiz-option.incorrect {
            border-color: var(--accent-red);
            background: rgba(218, 54, 51, 0.15);
        }

        /* DocCheck Table / List Styles */
        .doccheck-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-blue);
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .doccheck-term {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-blue);
            margin-bottom: 4px;
        }

        .doccheck-def {
            font-size: 12px;
            line-height: 1.4;
            color: var(--text-primary);
        }

        .doccheck-tag {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 9px;
            background: var(--border-color);
            color: var(--text-secondary);
            padding: 2px 6px;
            border-radius: 3px;
            margin-top: 6px;
        }

        .btn-action {
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: auto;
        }

        /* Console log window */
        .terminal-log {
            background: black;
            border: 1px solid var(--border-color);
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 10px;
            border-radius: 4px;
            height: 120px;
            overflow-y: auto;
            color: #33ff33;
        }
    </style>
</head>
<body>

    <header>
        <div class="sys-title">CYTOS_OS v2.4</div>
        <div class="sys-status">POSTER_DATA_LOADED</div>
    </header>

    <nav>
        <button class="nav-btn active" onclick="switchMode('study')">LERNEN</button>
        <button class="nav-btn" onclick="switchMode('flashcard')">CARDS</button>
        <button class="nav-btn" onclick="switchMode('quiz')">QUIZ</button>
        <button class="nav-btn" onclick="switchMode('doccheck')">LATIN</button>
        <button class="nav-btn" onclick="switchMode('review')">LOGS</button>
    </nav>

    <main>
        <!-- Topic Sub-navigation (For Study, Flashcard, Quiz) -->
        <div class="topic-selector" id="topic-bar">
            <button class="topic-btn active" onclick="switchTopic(0)">1. Anatomie</button>
            <button class="topic-btn" onclick="switchTopic(1)">2. Histologie</button>
            <button class="topic-btn" onclick="switchTopic(2)">3. Reifung</button>
        </div>

        <!-- 1. STUDY MODE -->
        <div id="view-study" class="view-panel active">
            <div id="study-content" style="font-size: 13px; line-height: 1.5;"></div>
        </div>

        <!-- 2. FLASHCARD MODE -->
        <div id="view-flashcard" class="view-panel">
            <div class="card-container" id="flashcard" onclick="flipCard()">
                <div class="card-inner">
                    <div class="card-front">
                        <div class="card-label">BEGRIFF (LATIN)</div>
                        <div class="card-text" id="card-term">...</div>
                    </div>
                    <div class="card-back">
                        <div class="card-label">POSTER-DEFINITION</div>
                        <div class="card-text" id="card-def" style="font-size: 13px;">...</div>
                    </div>
                </div>
            </div>
            <button class="btn-action" style="background: var(--border-color);" onclick="nextCard()">NÄCHSTE KARTE</button>
        </div>

        <!-- 3. QUIZ MODE -->
        <div id="view-quiz" class="view-panel">
            <div id="quiz-question" style="font-size: 14px; font-weight: bold; margin-bottom: 12px;"></div>
            <div id="quiz-options"></div>
        </div>

        <!-- 4. LATIN / DOCCHECK MODE (NEW 5TH CATEGORY) -->
        <div id="view-doccheck" class="view-panel">
            <div style="font-size: 11px; font-family: var(--font-mono); color: var(--text-secondary); margin-bottom: 8px;">
                EXACT POSTER TERMINOLOGY // DOCCHECK EXPLANATIONS
            </div>
            <div id="doccheck-list" style="overflow-y: auto; max-height: 100%;"></div>
        </div>

        <!-- 5. AI DIAGNOSTIC REVIEW -->
        <div id="view-review" class="view-panel">
            <div style="font-size: 12px; font-family: var(--font-mono); color: var(--accent-blue); margin-bottom: 6px;">
                > SYSTEM_FEHLER_LOGBUCH (LOCAL_STORAGE)
            </div>
            <div class="terminal-log" id="review-logs">
                [SYSTEM]: Keine Fehlversuche aufgezeichnet.
            </div>
            <button class="btn-action" style="background: var(--accent-red); margin-top: 10px;" onclick="clearLogs()">SPEICHER LÖSCHEN</button>
        </div>
    </main>

    <script>
        // AUDIO FEEDBACK SYNTHESIS (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSuccessSound() {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now); // C5
            osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.15); // E5
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.2);
        }

        function playFailureSound() {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(130.81, now); // C3
            osc.frequency.exponentialRampToValueAtTime(65.41, now + 0.3); // C2 ("bowomp")
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.3);
        }

        // DATA STORE (PULLED STRICTLY FROM POSTER MATERIAL)
        const appData = {
            topics: [
                {
                    title: "Anatomie & Temperatur",
                    study: `
                        <b>Hoden (Testis):</b> Männliche Keimdrüse im Hodensack (Skrotum). Erfüllt zwei Hauptfunktionen: Bildung von Spermien (Spermatogenese) und Produktion von Testosteron.<br><br>
                        <b>Aufbau:</b> Umgeben von einer Bindegewebskapsel (<i>Tunica albuginea</i>). Von dort ziehen Bindegewebssepten (<i>Septula testis</i>) ins Innere und teilen den Hoden in ca. 250 Hodenläppchen (<i>Lobuli testis</i>).<br><br>
                        <b>Hodensack (Skrotum):</b> Haut- und Muskeltasche. Die Temperatur liegt <b>2–4 °C unter der normalen Körpertemperatur</b>. Der <i>M. cremaster</i> zieht den Hoden bei Kälte näher an den Körper; bei Wärme entspannt er sich zur Kühlung.<br><br>
                        <b>Nebenhoden (Epididymis):</b> Gangsystem bestehend aus Kopf (<i>Caput</i>), Körper (<i>Corpus</i>) und Schwanz (<i>Cauda</i>). Dient der Reifung und Speicherung. Im Schwanz (<i>Cauda epididymidis</i>) werden reife Spermien gespeichert.
                    `,
                    cards: [
                        { term: "Tunica albuginea", def: "Bindegewebskapsel, die den Hoden umgibt." },
                        { term: "Septula testis", def: "Bindegewebssepten, die den Hoden in ca. 250 Lobuli testis unterteilen." },
                        { term: "Cauda epididymidis", def: "Schwanz des Nebenhodens; spezifischer Ort der Speicherung reifer Spermien." },
                        { term: "M. cremaster", def: "Cremaster-Muskel; reguliert den Abstand der Hoden zum Körper zur Temperaturkontrolle." }
                    ],
                    quizzes: [
                        {
                            q: "Um wie viel Grad liegt die Temperatur im Skrotum unter der Körpertemperatur?",
                            options: ["1–2 °C", "2–4 °C", "5–6 °C", "0.5–1 °C"],
                            correct: 1,
                            explain: "Laut Poster liegt die optimale Temperatur für die Spermienbildung im Skrotum genau 2–4 °C unter der normalen Körpertemperatur."
                        },
                        {
                            q: "Wo genau werden reife Spermien im Nebenhoden gespeichert?",
                            options: ["Caput epididymidis", "Corpus epididymidis", "Cauda epididymidis", "Tunica albuginea"],
                            correct: 2,
                            explain: "Das Poster ordnet die Speicherung reifer Spermien spezifisch dem Schwanz (Cauda epididymidis) zu."
                        },
                        {
                            q: "Welche Struktur unterteilt den Hoden in ca. 250 Läppchen (Lobuli testis)?",
                            options: ["Septula testis", "Ductus deferens", "Plexus pampiniformis", "Rete testis"],
                            correct: 0,
                            explain: "Die Septula testis sind Bindegewebssepten, die von der Tunica albuginea ins Innere ziehen."
                        }
                    ]
                },
                {
                    title: "Histologie & Zellen",
                    study: `
                        <b>Samenkanälchen (Tubuli seminiferi):</b> Vielfach gewundene Kanälchen in den Hodenläppchen; der eigentliche Ort der Spermatogenese. In der Wand liegen Keimzellen sowie <b>Sertoli-Zellen</b>.<br><br>
                        <b>Sertoli-Zellen:</b> Wichtige Funktion als Ammenzellen; sie befinden sich in der Wand der Samenkanälchen zur Unterstützung und Ernährung der Keimzellen.<br><br>
                        <b>Leydig-Zellen:</b> Liegen im Zwischengewebe (interstitiell) zwischen den Samenkanälchen. Sie sind für die endokrine Funktion zuständig: Produktion des Männlichkeitshormons Testosteron.<br><br>
                        <b>Verbindung:</b> Die Samenkanälchen münden in das Hodennetzwerk (<i>Rete testis</i>).
                    `,
                    cards: [
                        { term: "Tubuli seminiferi", def: "Samenkanälchen; Ort der Bildung und Entwicklung männlicher Keimzellen." },
                        { term: "Sertoli-Zellen", def: "Ammenzellen in der Wand der Samenkanälchen zur Betreuung der Keimzellen." },
                        { term: "Leydig-Zellen", def: "Zwischenzellen im Bindegewebe; produzieren das Sexualhormon Testosteron." },
                        { term: "Rete testis", def: "Hodennetz, in das die Samenkanälchen münden." }
                    ],
                    quizzes: [
                        {
                            q: "Wo befinden sich die Leydig-Zwischenzellen?",
                            options: ["In der Wand der Tubuli", "Im Zwischengewebe zwischen den Samenkanälchen", "Im Caput epididymidis", "Direkt im Rete testis"],
                            correct: 1,
                            explain: "Leydig-Zellen liegen interstitiell im Bindegewebe zwischen den gewundenen Samenkanälchen."
                        },
                        {
                            q: "Welche Funktion wird den Sertoli-Zellen im Poster zugewiesen?",
                            options: ["Testosteronsynthese", "Ammenzellen / Unterstützung der Keimzellen", "Spermienbewegung", "Kühlung des Skrotums"],
                            correct: 1,
                            explain: "Sertoli-Zellen dienen als unterstützende Ammenzellen im Keimepithel der Samenkanälchen."
                        },
                        {
                            q: "Wie heißt das Netzwerk, in das die Tubuli seminiferi münden?",
                            options: ["Septula testis", "Lobuli testis", "Rete testis", "Ductus deferens"],
                            correct: 2,
                            explain: "Das Rete testis (Hodennetz) nimmt die Spermien aus den Samenkanälchen auf."
                        }
                    ]
                },
                {
                    title: "Reifung & Hormonachse",
                    study: `
                        <b>Spermatogenese (Ablauf & Chromosomen):</b><br>
                        • <b>Mitose:</b> Diploide Spermatogonien (2n, 46 Chr.) vermehren sich $\\rightarrow$ Primäre Spermatozyten (2n).<br>
                        • <b>Meiose I:</b> Reifeteilung 1 halbiert den Chromosomensatz $\\rightarrow$ Sekundäre Spermatozyten (n, haploid).<br>
                        • <b>Meiose II:</b> Reifeteilung 2 $\\rightarrow$ 4 haploide Spermatiden (n, 23 Chr.).<br>
                        • <b>Spermiogenese:</b> Reifung (61–74 Tage) der Spermatiden zu funktionstüchtigen Spermien (Spermatozoen).<br><br>
                        <b>Hormonelle Steuerung (Hypothalamus-Hypophysen-Achse):</b><br>
                        Hypothalamus schüttet <b>Gonadoliberin (GnRH)</b> aus $\\rightarrow$ Regt Hypophyse zur Ausschüttung von <b>LH</b> (Luteinisierendes Hormon) und <b>FSH</b> an.<br>
                        • <b>LH:</b> Stimuliert Leydig-Zellen zur Testosteronsynthese.<br>
                        • <b>Testosteron:</b> Fördert Spermatogenese, Libido, Behaarung, Muskelmasse.<br>
                        • <b>Negative Rückkopplung:</b> Ein steigender Testosteronspiegel blockiert die Gonadoliberin-Freisetzung, um extreme Schwankungen zu verhindern.
                    `,
                    cards: [
                        { term: "Spermatogonien", def: "Diploide Stammzellen (2n, 46 Chromosomen); vermehren sich durch Mitose." },
                        { term: "Spermiogenese", def: "Differenzierung/Reifung der Spermatiden zu Spermien (dauert 61–74 Tage)." },
                        { term: "LH (Luteinisierendes Hormon)", def: "Hypophysenhormon; stimuliert die Leydig-Zellen zur Testosteronbildung." },
                        { term: "Negative Rückkopplung", def: "Hemmung der GnRH-Ausschüttung durch hohe Testosteronspiegel zur Hormonkonstanz." }
                    ],
                    quizzes: [
                        {
                            q: "Welches Ergebnis liefert die Meiose I bei den Keimzellen?",
                            options: ["Diploide Spermatogonien (2n)", "Sekundäre Spermatozyten mit haploidem Satz (n)", "Funktionstüchtige Spermien", "Spermatiden mit 46 Chromosomen"],
                            correct: 1,
                            explain: "In Meiose I wird der Chromosomensatz von diploid (2n) auf haploid (n) halbiert."
                        },
                        {
                            q: "Welches Hormon regt die Leydig-Zellen direkt zur Testosteronproduktion an?",
                            options: ["FSH", "LH (Luteinisierendes Hormon)", "GnRH", "Progesteron"],
                            correct: 1,
                            explain: "LH aus der Hypophyse stimuliert spezifisch die Leydig-Zellen zur Synthese von Testosteron."
                        },
                        {
                            q: "Wie lange dauert die Reifung (Spermiogenese) laut den Posterangaben?",
                            options: ["28 Tage", "61–74 Tage", "100 Tage", "12–14 Tage"],
                            correct: 1,
                            explain: "Die Transformation von Spermatiden zu reifen Spermien ist auf dem Poster mit 61–74 Tagen angegeben."
                        }
                    ]
                }
            ],

            // 5TH CATEGORY: LATIN TERMINOLOGY WITH DOCCHECK DEFINITIONS
            doccheck: [
                { term: "Testis (Hoden)", def: "Männliche Keimdrüse (Gonade) zur Produktion von Spermien und Androgenen (Testosteron).", tag: "Anatomie" },
                { term: "Skrotum (Hodensack)", def: "Kutaner Muskeleinschluß außerhalb der Bauchhöhle zur Thermoregulation der Hoden.", tag: "Anatomie" },
                { term: "Epididymis (Nebenhoden)", def: "Dem Hoden aufgelagertes Gangsystem (Caput, Corpus, Cauda) zur Reifung und Speicherung von Spermien.", tag: "Anatomie" },

                { term: "Septula testis", def: "Bindegewebsstraßen, die von der Tunica albuginea aus das Hodeninnere in Lobuli unterteilen.", tag: "Histologie" },

                { term: "Tubuli seminiferi", def: "Samenkanälchen; Ort der Keimzellproliferation und Spermatogenese.", tag: "Histologie" },
                { term: "Rete testis", def: "Intratestikuläres Netzwerk von Kanälchen im Mediastinum testis zum Transport der Spermien.", tag: "Anatomie" },
                { term: "Ductus deferens", def: "Samenleiter; dickwandiger Muskelschlauch zum Transport der Spermien beim Ejakulat.", tag: "Anatomie" },
                { term: "Sertoli-Zellen", def: "Epitheliale Stützzellen ('Ammenzellen') in den Tubuli seminiferi zur Ernährung der Keimzellen.", tag: "Histologie" },
                { term: "Leydig-Zellen", def: "Interstitielle Steroidzellen im Bindegewebe zwischen den Tubuli; Hauptbildungsort von Testosteron.", tag: "Histologie" },
                { term: "Spermatogonien", def: "Diploide Stammzellen an der Basalmembran der Samenkanälchen.", tag: "Spermatogenese" },
                { term: "Spermatiden", def: "Haploide Zellen, die aus der zweiten meiotischen Teilung hervorgehen.", tag: "Spermatogenese" },
                { term: "Spermiogenese", def: "Morphologische Differenzierung von der haploiden Spermatide zum funktionellen Spermium.", tag: "Spermatogenese" },
                { term: "Plexus pampiniformis", def: "Venengeflecht des Samenstrangs; dient dem getrennten Wärmeaustausch für die Hodentemperatur.", tag: "Anatomie" }
            ]
        };

        // APP STATE
        let currentMode = 'study';
        let currentTopic = 0;
        let cardIndex = 0;

        // NAVIGATION LOGIC
        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.view-panel').forEach(panel => panel.classList.remove('active'));

            // Toggle top topic bar (only relevant for study/flashcard/quiz)
            const topicBar = document.getElementById('topic-bar');
            if (mode === 'doccheck' || mode === 'review') {
                topicBar.style.display = 'none';
            } else {
                topicBar.style.display = 'flex';
            }

            event.target.classList.add('active');
            document.getElementById(`view-${mode}`).classList.add('active');

            renderCurrentView();
        }

        function switchTopic(index) {
            currentTopic = index;
            document.querySelectorAll('.topic-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            cardIndex = 0;
            renderCurrentView();
        }

        // RENDERING VIEWS
        function renderCurrentView() {
            if (currentMode === 'study') {
                document.getElementById('study-content').innerHTML = appData.topics[currentTopic].study;
            } 
            else if (currentMode === 'flashcard') {
                const card = appData.topics[currentTopic].cards[cardIndex];
                document.getElementById('card-term').innerText = card.term;
                document.getElementById('card-def').innerText = card.def;
                document.getElementById('flashcard').classList.remove('flipped');
            } 
            else if (currentMode === 'quiz') {
                renderQuiz();
            } 
            else if (currentMode === 'doccheck') {
                renderDocCheck();
            } 
            else if (currentMode === 'review') {
                renderLogs();
            }
        }

        // FLASHCARD LOGIC
        function flipCard() {
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        function nextCard() {
            const cards = appData.topics[currentTopic].cards;
            cardIndex = (cardIndex + 1) % cards.length;
            renderCurrentView();
        }

        // QUIZ LOGIC
        let activeQuizIdx = 0;
        function renderQuiz() {
            const quiz = appData.topics[currentTopic].quizzes[activeQuizIdx];
            document.getElementById('quiz-question').innerText = quiz.q;
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';

            quiz.options.forEach((opt, idx) => {
                const div = document.createElement('div');
                div.className = 'quiz-option';
                div.innerText = opt;
                div.onclick = () => checkAnswer(idx, quiz.correct, quiz.explain, div);
                optionsContainer.appendChild(div);
            });
        }

        function checkAnswer(selected, correct, explain, element) {
            const options = document.querySelectorAll('.quiz-option');
            options.forEach(opt => opt.onclick = null); // Lock options

            if (selected === correct) {
                element.classList.add('correct');
                playSuccessSound();
            } else {
                element.classList.add('incorrect');
                options[correct].classList.add('correct');
                playFailureSound();
                logError(appData.topics[currentTopic].quizzes[activeQuizIdx].q, explain);
            }

            // Auto advance after 2.5s
            setTimeout(() => {
                activeQuizIdx = (activeQuizIdx + 1) % appData.topics[currentTopic].quizzes.length;
                renderQuiz();
            }, 2500);
        }

        // DOCCHECK RENDERER (5TH CATEGORY)
        function renderDocCheck() {
            const container = document.getElementById('doccheck-list');
            container.innerHTML = '';

            appData.doccheck.forEach(item => {
                const card = document.createElement('div');
                card.className = 'doccheck-card';
                card.innerHTML = `
                    <div class="doccheck-term">${item.term}</div>
                    <div class="doccheck-def">${item.def}</div>
                    <span class="doccheck-tag">${item.tag}</span>
                `;
                container.appendChild(card);
            });
        }

        // DIAGNOSTIC LOGGING (LOCALSTORAGE)
        function logError(question, explanation) {
            let logs = JSON.parse(localStorage.getItem('cytos_errors') || '[]');
            logs.unshift({
                timestamp: new Date().toLocaleTimeString(),
                q: question,
                exp: explanation
            });
            localStorage.setItem('cytos_errors', JSON.stringify(logs.slice(0, 10)));
        }

        function renderLogs() {
            let logs = JSON.parse(localStorage.getItem('cytos_errors') || '[]');
            const logContainer = document.getElementById('review-logs');
            if (logs.length === 0) {
                logContainer.innerHTML = '[SYSTEM]: Keine Fehlversuche aufgezeichnet. Alle Tests nominal.';
            } else {
                logContainer.innerHTML = logs.map(l => 
                    `[${l.timestamp}] FEHLER:\nFrage: ${l.q}\nErklärung: ${l.exp}\n-------------------`
                ).join('\n\n');
            }
        }

        function clearLogs() {
            localStorage.removeItem('cytos_errors');
            renderLogs();
        }

        // INIT
        renderCurrentView();
    </script>
</body>
</html>
